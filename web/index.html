<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Byditors Cut</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23000'/%3E%3Cpath d='M9 7h8.5a5 5 0 0 1 2.6 9.3A5.2 5.2 0 0 1 17.8 26H9z' fill='%23fff'/%3E%3Cpath d='M6 23 26 9' stroke='%23c6f24e' stroke-width='3'/%3E%3C/svg%3E">
<style>
@font-face{font-family:"Inter";src:url(/static/inter-regular.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Inter";src:url(/static/inter-medium.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Inter";src:url(/static/inter-semibold.woff2) format("woff2");font-weight:600;font-display:swap}
:root{
  --ground:#000;--surface:#111;--raised:#2a2a2a;--border:#1a1a1a;--rule:#161616;--control:#444;
  --text:#fff;--muted:#b4b4b4;--faint:#949494;--nav:#bbb;
  --accent:#c6f24e;--positive:#c6f24e;--negative:#e5484d;--warning:#e5a93b;
  --pill-positive-bg:#222a10;--pill-positive-ink:#c6f24e;
  --pill-negative-bg:#2c1a20;--pill-negative-ink:#e5566f;
  --pill-warning-bg:#2b2414;--pill-warning-ink:#e5a93b;
  --pill-neutral-bg:#222;--pill-neutral-ink:#fff;
  --radius-card:20px;--radius-inner:12px;--gap:14px;--pad:22px;--ctl:36px;
  --fs-title:20px;--fs-section:16px;--fs-kpi:24px;--fs-body:14px;--fs-small:12px;
  --ease-out:cubic-bezier(.23,1,.32,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--text);font:400 var(--fs-body)/1.5 "Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
::selection{background:var(--accent);color:#000}
:focus-visible{outline:2px solid var(--text);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#262626;border-radius:10px;border:2px solid #000}::-webkit-scrollbar-track{background:transparent}
a{color:inherit;text-underline-offset:3px}
button,input,select,textarea{font:inherit;color:inherit}
.num,td.n,.kpi b{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
.camp{margin-top:var(--gap)}
.camp h2{font-size:var(--fs-section);font-weight:600;margin:0}
.kpis.small{grid-template-columns:repeat(4,1fr);background:transparent;border:1px solid #1d1d1d}
.kpis.small .kpi b{font-size:22px}
.cpm{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cpm label{display:grid;gap:4px;font-size:12px;color:var(--muted)}
@media (max-width:860px){.cpm,.kpis.small{grid-template-columns:repeat(2,1fr)}}
.trim{margin:16px 4px 0;padding-top:14px;border-top:1px solid var(--border)}
.trim h3{font-size:14px;font-weight:600;margin:0 0 10px}
.trim video{width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;margin-bottom:10px}
.trimrow{display:grid;grid-template-columns:38px 1fr 64px auto;align-items:center;gap:8px;margin:4px 0;font-size:13px}
.trimrow input[type=range]{width:100%;accent-color:var(--accent,#e5a93b)}
.trimrow output{font-variant-numeric:tabular-nums;color:var(--muted)}

/* shell: ruled T-frame */
.shell{display:grid;grid-template-columns:220px 1fr;grid-template-rows:64px 1fr;min-height:100vh}
.brand{grid-row:1;display:flex;align-items:center;gap:10px;padding:0 20px;border-right:1px solid var(--border);border-bottom:1px solid var(--border)}
.brand b{font-weight:600;font-size:15px;letter-spacing:-.01em}
.top{display:flex;align-items:center;gap:10px;padding:0 29px;border-bottom:1px solid var(--border);min-width:0}
.side{border-right:1px solid var(--border);padding:18px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;align-self:start;height:calc(100vh - 64px)}
.side h6{margin:18px 10px 6px;font:400 12px/1 "Inter";color:var(--faint)}
.side a{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:8px;color:var(--nav);text-decoration:none;transition:color .15s ease}
.side a svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.side a:hover{color:#e6e6e6}
.side a[aria-current=page]{color:var(--text)}
.side a .count{margin-left:auto;font-size:12px;font-variant-numeric:tabular-nums;color:var(--text);background:var(--raised);border-radius:999px;padding:1px 8px}
.side .foot{margin-top:auto;padding:10px;color:var(--faint);font-size:12px;line-height:1.7}
.side .foot span{display:flex;justify-content:space-between}
.side .foot i{font-style:normal;color:var(--muted)}
.side .foot i.on{color:var(--positive)}
main{padding:24px 29px 64px;min-width:0}

/* top bar: the most frequent job, clip a video */
.clipbar{flex:1;display:flex;gap:8px;max-width:760px}
.clipbar input{flex:1;min-width:0;height:var(--ctl);background:var(--surface);border:1px solid #222;border-radius:999px;padding:0 16px;outline:none;transition:border-color .15s ease}
.clipbar input::placeholder{color:var(--faint)}
.clipbar input:focus{border-color:#555}
.topright{margin-left:auto;display:flex;align-items:center;gap:14px;height:100%;padding-left:20px;border-left:1px solid var(--border);color:var(--muted);font-size:13px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint);display:inline-block}
.dot.live{background:var(--negative)}

/* controls */
.btn{height:var(--ctl);padding:0 16px;border-radius:999px;border:0;background:var(--raised);color:var(--text);font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;transition:transform .16s var(--ease-out),background-color .15s ease;text-decoration:none}
.btn:hover{background:#333}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--text);color:#000}
.btn.primary:hover{background:#e6e6e6}
.btn.ghost{background:transparent;border:1px solid var(--control)}
.btn.ghost:hover{background:#151515}
.btn.danger{background:var(--pill-negative-bg);color:var(--pill-negative-ink)}
.btn.sm{height:30px;padding:0 12px;font-size:13px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn .spin{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
label.f{display:block;font-size:13px;font-weight:500;margin:0 0 6px}
.field{width:100%;height:40px;background:#0a0a0a;border:1px solid #2a2a2a;border-radius:10px;padding:0 12px;outline:none;transition:border-color .15s ease}
textarea.field{height:auto;min-height:92px;padding:10px 12px;line-height:1.5;resize:vertical}
.field:focus{border-color:#666}
select.field{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#999 50%),linear-gradient(135deg,#999 50%,transparent 50%);background-position:calc(100% - 17px) 18px,calc(100% - 12px) 18px;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.hint{color:var(--faint);font-size:12px;margin-top:6px}
.tog{position:relative;width:32px;height:18px;flex:none}
.tog input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.tog span{position:absolute;inset:0;background:var(--control);border-radius:99px;transition:background-color .15s ease;pointer-events:none}
.tog span::after{content:"";position:absolute;width:14px;height:14px;top:2px;left:2px;border-radius:50%;background:#fff;transition:transform .18s var(--ease-out)}
.tog input:checked+span{background:var(--text)}
.tog input:checked+span::after{transform:translateX(14px);background:#000}
.tog input:focus-visible+span{outline:2px solid #fff;outline-offset:2px}

/* type + layout */
.titlerow{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px}
h1{font-size:var(--fs-title);font-weight:600;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);margin:4px 0 0}
h2{font-size:var(--fs-section);font-weight:600;margin:0}
.card{background:var(--surface);border-radius:var(--radius-card);padding:var(--pad)}
.card>header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 384px;gap:var(--gap);align-items:start}
.col{display:flex;flex-direction:column;gap:var(--gap);min-width:0}
.railh{margin:0 0 8px;font-size:var(--fs-section);font-weight:600}
.muted{color:var(--muted)}.faint{color:var(--faint)}

/* KPIs: type, not tiles */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-radius:var(--radius-card)}
.kpi{padding:18px var(--pad);border-left:1px solid #1d1d1d}
.kpi:first-child{border-left:0}
.kpi span{display:block;color:var(--muted);font-size:13px}
.kpi b{display:block;font-size:var(--fs-kpi);font-weight:500;margin:4px 0 2px;letter-spacing:-.01em}
.kpi small{color:var(--faint);font-size:12px}
.kpi b.warn{color:var(--warning)}.kpi b.bad{color:var(--negative)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:500;background:var(--pill-neutral-bg);color:var(--pill-neutral-ink);white-space:nowrap}
.pill.pass,.pill.ok{background:var(--pill-positive-bg);color:var(--pill-positive-ink)}
.pill.review{background:var(--pill-warning-bg);color:var(--pill-warning-ink)}
.pill.block,.pill.failed{background:var(--pill-negative-bg);color:var(--pill-negative-ink)}
.pill.live{background:var(--pill-negative-bg);color:#ff8a8f}

/* live studio: signature element */
.livecard{display:grid;grid-template-columns:1fr auto;gap:10px 20px;align-items:center;padding:18px 0;border-top:1px solid #1d1d1d}
.livecard:first-of-type{border-top:0;padding-top:4px}
.livecard h3{margin:0;font-size:15px;font-weight:600;display:flex;align-items:center;gap:10px}
.livecard p{margin:2px 0 0;color:var(--muted);font-size:13px}
.heat{grid-column:1/-1;height:64px;display:block;width:100%}
.liveacts{display:flex;gap:8px}

/* clip shelf */
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:12px}
.tile{display:block;text-decoration:none;color:inherit;border-radius:var(--radius-inner);cursor:pointer}
.tile .ph{aspect-ratio:9/16;border-radius:var(--radius-inner);background:#1b1b1b center/cover no-repeat;position:relative;overflow:hidden;transition:transform .2s var(--ease-out)}
.tile:hover .ph{transform:scale(.985)}
.tile .ph .pill{position:absolute;left:8px;top:8px}
.tile .ph .len{position:absolute;right:8px;bottom:8px;font-size:12px;background:rgba(0,0,0,.72);border-radius:6px;padding:1px 6px;font-variant-numeric:tabular-nums}
.tile b{display:block;font-weight:500;font-size:13px;margin-top:8px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile small{color:var(--faint);font-size:12px}

/* lists */
.rows{list-style:none;margin:0;padding:0}
.rows li{display:flex;gap:10px;align-items:center;min-height:45px;padding:8px 0;border-top:1px solid #1d1d1d}
.rows li:first-child{border-top:0}
.rows .grow{flex:1;min-width:0}
.rows .t{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rows small{display:block;color:var(--faint);font-size:12px}
.bar{height:4px;background:var(--raised);border-radius:4px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--text);border-radius:4px;transition:transform .4s var(--ease-out);transform-origin:left}
.ev{font-size:13px;line-height:1.45}
.ev time{color:var(--faint);font-variant-numeric:tabular-nums;font-size:12px;flex:none;width:44px}
.ev.error .grow{color:#ff9aa0}.ev.warn .grow{color:var(--warning)}

/* tables */
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:400;color:var(--faint);font-size:12px;padding:0 12px 10px}
td{padding:12px;border-top:1px solid #1d1d1d;vertical-align:middle}
td.n,th.n{text-align:right}
tr.click{cursor:pointer;transition:background-color .12s ease}
tr.click:hover td{background:#151515}

/* inbox */
.inbox{display:grid;grid-template-columns:320px minmax(0,1fr);gap:var(--gap);align-items:start}
.qlist{background:var(--surface);border-radius:var(--radius-card);padding:8px;max-height:calc(100vh - 170px);overflow:auto;position:sticky;top:16px}
.qitem{display:flex;gap:12px;padding:8px;border-radius:12px;cursor:pointer;align-items:center;transition:background-color .12s ease;width:100%;background:none;border:0;text-align:left}
.qitem:hover{background:#181818}
.qitem[aria-selected=true]{background:var(--raised)}
.qitem img,.qitem .noimg{width:44px;height:78px;object-fit:cover;border-radius:8px;background:#1b1b1b;flex:none}
.qitem b{font-weight:500;font-size:13px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qitem small{display:block;color:var(--faint);font-size:12px;margin:3px 0 5px}
.filters{display:flex;gap:6px;padding:4px 4px 10px;flex-wrap:wrap}
.chip{height:28px;padding:0 12px;border-radius:999px;background:transparent;border:1px solid #2c2c2c;color:var(--muted);cursor:pointer;font-size:13px;transition:color .12s ease,border-color .12s ease}
.chip[aria-pressed=true]{color:var(--text);border-color:#777}
.detail{display:grid;grid-template-columns:300px minmax(0,1fr);gap:var(--gap);align-items:start}
.player{background:var(--surface);border-radius:var(--radius-card);padding:12px}
.player video{width:100%;aspect-ratio:9/16;border-radius:12px;background:#000;display:block}
.player dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:12px 6px 4px;font-size:13px}
.player dt{color:var(--faint)}.player dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.checks{list-style:none;margin:0;padding:0}
.checks li{display:grid;grid-template-columns:18px 160px 1fr;gap:12px;padding:12px 0;border-top:1px solid #1d1d1d;align-items:start}
.checks li:first-child{border-top:0;padding-top:2px}
.checks .mk{width:10px;height:10px;border-radius:50%;margin-top:5px;background:var(--faint)}
.checks .ok .mk{background:var(--positive)}
.checks .review .mk{background:var(--warning)}
.checks .block .mk{background:var(--negative)}
.checks .warn .mk{background:transparent;border:1.5px solid var(--faint)}
.checks b{font-weight:500}
.checks p{margin:0;color:var(--muted)}
.checks em{display:block;font-style:normal;color:var(--faint);font-size:13px;margin-top:2px}
.verdict{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.verdict strong{font-size:var(--fs-kpi);font-weight:500;letter-spacing:-.01em}
.verdict.pass strong{color:var(--positive)}.verdict.review strong{color:var(--warning)}.verdict.block strong{color:var(--negative)}
.tabs{display:flex;gap:4px;margin-bottom:10px}
.tabs button{height:30px;padding:0 12px;border-radius:999px;border:0;background:none;color:var(--nav);cursor:pointer}
.tabs button[aria-selected=true]{background:var(--raised);color:var(--text)}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.targets{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.targets label{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px 0 10px;border-radius:999px;background:#0a0a0a;border:1px solid #2a2a2a;cursor:pointer;font-size:13px}
.targets input{accent-color:#fff}
.musicstrip{height:28px;width:100%;display:block;margin-top:8px}

/* forms in two columns (settings, accounts, streamer editor) */
.sect{display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;padding:28px 0;border-top:1px solid var(--border)}
.sect:first-of-type{border-top:0;padding-top:4px}
.sect>div:first-child h2{margin-bottom:6px}
.sect>div:first-child p{color:var(--muted);margin:0}
.panel{background:var(--surface);border-radius:16px;padding:18px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fgrid .wide{grid-column:1/-1}
.swrow{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:12px 0;border-top:1px solid #1d1d1d}
.swrow:first-child{border-top:0;padding-top:0}
.swrow b{font-weight:500}.swrow p{margin:2px 0 0;color:var(--muted);font-size:13px}
.risk{display:grid;grid-template-columns:1fr 150px;gap:12px;align-items:center;padding:8px 0;border-top:1px solid #1d1d1d}
.risk:first-child{border-top:0}
.empty{padding:8px 0 4px;color:var(--muted)}
.empty b{display:block;color:var(--text);font-weight:500;margin-bottom:4px}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;background:#0a0a0a;border-radius:8px;padding:2px 6px}

/* toast */
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,0);background:var(--text);color:#000;padding:10px 16px;border-radius:999px;font-weight:500;box-shadow:0 8px 30px rgba(0,0,0,.5);transition:opacity .2s ease,transform .25s var(--ease-out);z-index:20;max-width:min(560px,90vw)}
.toast.err{background:#2c1a20;color:#ffb3b7}
.toast[data-hide]{opacity:0;transform:translate(-50%,8px);pointer-events:none}

.menu{display:none}
@media (max-width:1180px){.grid{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(3,1fr)}.kpi:nth-child(4){border-left:0}.detail{grid-template-columns:1fr}.player{max-width:340px}}
@media (max-width:860px){
  .shell{grid-template-columns:1fr;grid-template-rows:56px auto 1fr}
  .brand{border-right:0}
  .top{grid-row:3;grid-column:1;display:none}
  .side{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:6px 10px;border-right:0;border-bottom:1px solid var(--border)}
  .side h6,.side .foot{display:none}
  .side a{flex:none}
  main{padding:18px 16px 64px}
  .mclip{display:flex!important}
  .kpis{grid-template-columns:1fr 1fr}.kpi{border-left:0;border-top:1px solid #1d1d1d}.kpi:nth-child(-n+2){border-top:0}
  .inbox,.sect{grid-template-columns:1fr}
  .qlist{position:static;max-height:none}
  .fgrid{grid-template-columns:1fr}
  .checks li{grid-template-columns:18px 1fr}.checks li p{grid-column:2}
  .titlerow{flex-direction:column;align-items:flex-start}
  .hide-m{display:none}
}
.mclip{display:none;gap:8px;margin-bottom:18px}

/* ---------- clip thumbnail ---------- */
.thumbed{display:grid;grid-template-columns:132px minmax(0,1fr);gap:16px;align-items:start}
.looked{display:grid;grid-template-columns:minmax(180px,240px) minmax(0,1fr);gap:18px;align-items:start}
.lkvals{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;font-size:13px}
.lkvals dt{color:var(--muted)}.lkvals dd{margin:0;font-variant-numeric:tabular-nums}
@media (max-width:860px){.looked{grid-template-columns:150px minmax(0,1fr)}}
.tframe{position:relative;aspect-ratio:9/16;border-radius:10px;overflow:hidden;background:#0d0d0d;box-shadow:inset 0 0 0 1px #222}
.tframe img,.tframe video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
@media (max-width:860px){.thumbed{grid-template-columns:110px minmax(0,1fr)}}

/* ---------- styles: how clips look ---------- */
.stylegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:18px}
.scard{display:flex;flex-direction:column;gap:10px;background:none;border:0;padding:0;text-align:left;cursor:pointer;color:inherit}
.scard .phone{transition:transform .2s var(--ease-out)}
@media (hover:hover) and (pointer:fine){.scard:hover .phone{transform:translateY(-2px)}}
.scard:active .phone{transform:scale(.98)}
.scard b{font-weight:500;font-size:14px;display:flex;align-items:center;gap:8px}
.scard small{color:var(--faint);font-size:12px}
.phone{position:relative;width:100%;aspect-ratio:9/16;border-radius:14px;overflow:hidden;background:#0d0d0d;isolation:isolate;box-shadow:inset 0 0 0 1px #1e1e1e;user-select:none}
.phone .lay{position:absolute;background-repeat:no-repeat;background-color:#151515}
.phone .bgblur{position:absolute;inset:-8%;background-size:cover;background-position:center;filter:blur(14px) brightness(.62)}
.phone .ph-ph{position:absolute;inset:0;display:grid;place-items:center;color:#3a3a3a;font-size:11px;background:repeating-linear-gradient(135deg,#141414 0 10px,#171717 10px 20px)}
.phone .t{position:absolute;left:50%;transform:translate(-50%,-50%);white-space:nowrap;line-height:1;text-align:center;paint-order:stroke fill;pointer-events:none}
.phone .t.drag{pointer-events:auto;cursor:grab;touch-action:none}
.phone .t.drag:active{cursor:grabbing}
.phone .t.drag::after{content:"";position:absolute;inset:-6px -10px;border:1.5px dashed transparent;border-radius:8px;transition:border-color .15s ease}
.phone:hover .t.drag::after{border-color:rgba(255,255,255,.45)}
.phone .t .w{display:inline-block;position:relative;margin:0 .07em}
.phone .t .rz{position:absolute;right:-14px;bottom:-14px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px #ff6a1a,0 2px 6px rgba(0,0,0,.5);cursor:nwse-resize;touch-action:none;opacity:0;transition:opacity .15s ease}
.phone:hover .t .rz,.phone .t .rz:active{opacity:1}
@media (hover:none){.phone .t .rz{opacity:1}}
.phone .t[data-size]::before{content:attr(data-size);position:absolute;left:50%;bottom:calc(100% + 22px);transform:translateX(-50%);font:600 11px/1 "Inter";color:#fff;background:#111;padding:4px 7px;border-radius:6px;-webkit-text-stroke:0;text-shadow:none}
.phone .vguide,.phone .hguide{position:absolute;pointer-events:none;opacity:0;transition:opacity .1s ease;background:#ff6a1a}
.phone .vguide{left:50%;top:0;bottom:0;width:1px}
.phone .hguide{left:0;right:0;height:1px;top:68%}
.phone .vguide.on,.phone .hguide.on{opacity:.9}
.phone .t .w i{position:absolute;z-index:-1;inset:-.08em -.14em;border-radius:.2em}
.phone .tag{position:absolute;font:600 10px/1 "Inter";padding:3px 6px;border-radius:5px;background:#ff6a1a;color:#fff;transform:translate(-50%,-100%);left:50%;top:-6px;opacity:0;transition:opacity .15s ease;pointer-events:none}
.phone:hover .tag{opacity:1}
.phone .camov{position:absolute;overflow:hidden;background-repeat:no-repeat;background-color:#222}
.phone .credit{position:absolute;right:4%;top:3.5%;font:600 9px/1 "Inter";color:rgba(255,255,255,.75)}
.seditor{display:grid;grid-template-columns:340px minmax(0,1fr);gap:28px;align-items:start}
.seditor .stage{position:sticky;top:16px;display:flex;flex-direction:column;gap:10px}
.seditor .stage video{width:100%;aspect-ratio:9/16;border-radius:14px;background:#000;display:block}
.stabs{display:flex;gap:4px;background:var(--surface);border-radius:999px;padding:4px;width:max-content;margin-bottom:16px}
.stabs button{height:32px;padding:0 16px;border-radius:999px;border:0;background:none;color:var(--nav);cursor:pointer;font-weight:500;transition:background-color .15s ease,color .15s ease}
.stabs button[aria-selected=true]{background:var(--raised);color:var(--text)}
.sgroup{padding:18px 0;border-top:1px solid var(--border)}
.sgroup:first-child{border-top:0;padding-top:0}
.sgroup>h3{font-size:13px;font-weight:600;margin:0 0 10px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.tilebtn{background:var(--surface);border:1.5px solid transparent;border-radius:12px;padding:6px 6px 8px;cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:stretch;color:var(--muted);font-size:12px;transition:border-color .15s ease,transform .16s var(--ease-out)}
.tilebtn:active{transform:scale(.97)}
.tilebtn[aria-pressed=true]{border-color:var(--accent);color:var(--text)}
.tilebtn .sw{height:62px;border-radius:8px;display:grid;place-items:center;overflow:hidden;background:linear-gradient(180deg,#3d4a2a,#1f2a1a 55%,#2a2416)}
.tilebtn .sw span{white-space:nowrap;line-height:1;paint-order:stroke fill}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips .chip{height:32px;font-size:13px}
.chips .chip.font{font-size:16px;letter-spacing:.01em}
.srow{display:grid;grid-template-columns:150px 1fr 48px;align-items:center;gap:12px;margin:6px 0;font-size:13px}
.srow input[type=range]{width:100%;accent-color:var(--accent)}
.srow output{color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.colors{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.colors label{display:flex;align-items:center;gap:10px;background:#0a0a0a;border:1px solid #232323;border-radius:10px;padding:6px 10px;font-size:13px;cursor:pointer}
.colors input[type=color]{width:26px;height:26px;border:0;padding:0;background:none;border-radius:6px;cursor:pointer}
.colors input[type=color]::-webkit-color-swatch-wrapper{padding:0}.colors input[type=color]::-webkit-color-swatch{border:1px solid #333;border-radius:6px}
.drawbox{position:relative;max-width:560px;border-radius:10px;overflow:hidden;background:#111;touch-action:none;cursor:crosshair;margin-top:10px;user-select:none}
.drawbox img{display:block;width:100%}
.drawbox .rect{position:absolute;border:2px solid var(--accent);background:rgba(198,242,78,.12);border-radius:4px;cursor:move}
.drawbox .rect::after{content:"";position:absolute;right:-6px;bottom:-6px;width:12px;height:12px;border-radius:3px;background:var(--accent);cursor:nwse-resize}
.drawbox .rect span{position:absolute;left:-2px;top:-22px;font:600 11px/1 "Inter";background:var(--accent);color:#000;padding:4px 6px;border-radius:5px 5px 5px 0}
.drawbox .rect.ai{border-style:dashed;border-color:#b57bff;background:rgba(181,123,255,.12);cursor:default}
.drawbox .rect.ai::after{display:none}.drawbox .rect.ai span{background:#b57bff;color:#fff}
.sname{field-sizing:content;min-width:120px;max-width:min(420px,60vw);background:none;border:0;border-bottom:1px solid transparent;font:600 var(--fs-title)/1.2 "Inter";color:var(--text);padding:2px 0;outline:none;transition:border-color .15s ease}
.sname:hover,.sname:focus{border-bottom-color:#444}
/* clip options popover under the top bar */
.optbtn{width:var(--ctl);padding:0;justify-content:center}
.optbtn[aria-expanded=true]{background:var(--text);color:#000}
.optbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round}
.clipopts{position:fixed;top:60px;left:250px;width:min(640px,calc(100vw - 270px));background:#121212;border:1px solid #262626;border-radius:16px;padding:18px;z-index:15;box-shadow:0 18px 50px rgba(0,0,0,.6);transform-origin:top left;transition:opacity .16s ease,transform .2s var(--ease-out)}
.clipopts[data-hide]{opacity:0;transform:translateY(-4px) scale(.98);pointer-events:none}
.clipopts .fgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
.clipopts h3{margin:0 0 12px;font-size:14px;font-weight:600}
.stepper{display:flex;align-items:center;background:#0a0a0a;border:1px solid #2a2a2a;border-radius:10px;height:40px}
.stepper button{width:36px;height:100%;border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px}
.stepper button:active{color:var(--text)}
.stepper input{flex:1;min-width:0;background:none;border:0;text-align:center;outline:none;font-variant-numeric:tabular-nums;font-size:15px}
.stepper small{color:var(--faint);padding-right:10px;font-size:12px}
@media (max-width:1180px){.seditor{grid-template-columns:280px minmax(0,1fr)}}
@media (max-width:860px){.seditor{grid-template-columns:1fr}.seditor .stage{position:static;max-width:300px}.clipopts{left:12px;width:calc(100vw - 24px)}.clipopts .fgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.6s!important}}
</style>
</head>
<body>
<div class="shell">
  <div class="brand">
    <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#161616"/><path d="M9 7h8.5a5 5 0 0 1 2.6 9.3A5.2 5.2 0 0 1 17.8 26H9z" fill="#fff"/><path d="M6 23 26 9" stroke="#c6f24e" stroke-width="3"/></svg>
    <b>Byditors Cut</b>
  </div>
  <div class="top">
    <form class="clipbar" id="clipform">
      <input id="clipurl" type="url" aria-label="Video or stream link to clip" placeholder="Paste a YouTube, Kick, Twitch or TikTok link to clip" required>
      <select class="field" id="cliprights" aria-label="Whose video is this?" style="width:auto;height:var(--ctl);border-radius:999px" title="Clips of videos that are yours, or that you have permission for, can be posted automatically"><option value="unknown">Clip only</option><option value="own">It's my video</option><option value="permission">I have permission</option></select>
      <select class="field" id="clipcamp" aria-label="Campaign" style="width:auto;height:var(--ctl);border-radius:999px" hidden title="Make these clips for a paid campaign: its rules apply"><option value="">No campaign</option></select>
      <button class="btn optbtn" type="button" id="optbtn" aria-expanded="false" aria-controls="clipopts" aria-label="Clip options" title="Clip options: how many, how long, which part, captions, style"><svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
      <button class="btn primary" type="submit">Make clips</button>
      <label class="btn ghost" for="upfile" tabindex="0">Upload</label>
      <input id="upfile" type="file" accept="video/*" hidden>
    </form>
    <div class="topright"><span class="dot" id="livedot"></span><span id="livetxt">Nobody live</span><span class="faint">This PC</span></div>
  </div>
  <nav class="side" aria-label="Main">
    <a href="#today" data-v="today"><svg viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5V20a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>Today</a>
    <a href="#inbox" data-v="inbox"><svg viewBox="0 0 24 24"><path d="M4 13h4l1.5 3h5L16 13h4"/><path d="M5.5 5h13L20 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-6z"/></svg>Clip inbox<span class="count" id="c-inbox" hidden></span></a>
    <a href="#streamers" data-v="streamers"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M12 17v4"/><circle cx="12" cy="11" r="2.5"/></svg>Streamers</a>
    <a href="#styles" data-v="styles"><svg viewBox="0 0 24 24"><path d="M14.5 4.5 19.5 9.5 10 19H5v-5z"/><path d="M12.5 6.5l5 5"/></svg>Styles</a>
    <a href="#campaigns" data-v="campaigns"><svg viewBox="0 0 24 24"><path d="M12 3v18M16.5 7.5c0-1.7-2-3-4.5-3s-4.5 1.3-4.5 3 2 2.6 4.5 3 4.5 1.4 4.5 3.3-2 3.2-4.5 3.2-4.5-1.4-4.5-3.2"/></svg>Campaigns</a>
    <h6>Publishing</h6>
    <a href="#queue" data-v="queue"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 9h16M9 3v4M15 3v4"/></svg>Post queue<span class="count" id="c-failed" hidden></span></a>
    <a href="#accounts" data-v="accounts"><svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 1 0-5.7l2.3-2.3a4 4 0 0 1 5.7 5.7l-1.2 1.1"/><path d="M14 10a4 4 0 0 1 0 5.7l-2.3 2.3a4 4 0 0 1-5.7-5.7l1.2-1.1"/></svg>Accounts</a>
    <a href="#settings" data-v="settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Guard &amp; settings</a>
    <div class="foot"><div id="tools"></div><a href="https://github.com/quasaritis/byditors-cut/issues/new" target="_blank" rel="noopener" style="display:flex;height:auto;padding:8px 0 0;color:var(--muted)">Feedback &amp; ideas ↗</a></div>
  </nav>
  <main id="main" tabindex="-1"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" data-hide></div>
<div class="clipopts" id="clipopts" role="dialog" aria-label="Clip options" data-hide>
  <h3>Clip options <span class="faint" style="font-weight:400;font-size:12px">&nbsp;Used for the next link or upload</span></h3>
  <div class="fgrid">
    <div><label class="f" for="o-streamer">Streamer</label><select class="field" id="o-streamer"><option value="">No streamer</option></select></div>
    <div><label class="f" for="o-style">Style</label><select class="field" id="o-style"></select></div>
    <div><label class="f" for="o-lang">Caption language</label><select class="field" id="o-lang"></select></div>
    <div><label class="f" for="o-count">Clips</label><div class="stepper"><button type="button" data-step="o-count:-1" aria-label="Fewer">−</button><input id="o-count" inputmode="numeric" value="6" aria-label="How many clips"><button type="button" data-step="o-count:1" aria-label="More">+</button></div></div>
    <div><label class="f" for="o-min">Shortest</label><div class="stepper"><button type="button" data-step="o-min:-5" aria-label="Shorter">−</button><input id="o-min" inputmode="numeric" value="15"><small>s</small><button type="button" data-step="o-min:5" aria-label="Longer">+</button></div></div>
    <div><label class="f" for="o-max">Longest</label><div class="stepper"><button type="button" data-step="o-max:-5" aria-label="Shorter">−</button><input id="o-max" inputmode="numeric" value="60"><small>s</small><button type="button" data-step="o-max:5" aria-label="Longer">+</button></div></div>
    <div class="wide"><label class="f">Part of the video</label><div style="display:flex;gap:8px;align-items:center"><input class="field" id="o-from" inputmode="decimal" placeholder="Start" style="width:120px"><span class="faint">to</span><input class="field" id="o-to" inputmode="decimal" placeholder="End" style="width:120px"><span class="faint" style="font-size:13px">minutes · leave empty for the whole video</span></div></div>
  </div>
  <div class="acts" style="margin-top:14px"><button type="button" class="btn ghost sm" id="o-reset">Back to the usual</button><a class="btn ghost sm" href="#styles">Edit styles</a><button type="button" class="btn primary sm" id="o-done" style="margin-left:auto">Done</button></div>
</div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const main = $("#main");
let S = {state: null, view: "today", sel: null, filter: "todo", timer: null};

async function api(path, opts = {}) {
  const o = {headers: {}, ...opts};
  if (o.body && !(o.body instanceof FormData)) { o.headers["content-type"] = "application/json"; o.body = JSON.stringify(o.body); }
  const r = await fetch(path, o);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.detail || j.error || `Request failed (${r.status})`);
  return j;
}
let toastT;
function toast(msg, err = false) {
  const t = $("#toast"); t.textContent = msg; t.className = "toast" + (err ? " err" : ""); t.removeAttribute("data-hide");
  clearTimeout(toastT); toastT = setTimeout(() => t.setAttribute("data-hide", ""), err ? 6000 : 3200);
}
async function act(btn, fn, ok) {
  const label = btn.innerHTML; btn.disabled = true; btn.innerHTML = `<span class="spin"></span>${label}`;
  try { const r = await fn(); if (ok) toast(ok); return r; } catch (e) { toast(e.message, true); }
  finally { btn.disabled = false; btn.innerHTML = label; }
}
const ago = t => { const s = Date.now() / 1000 - t; if (s < 60) return "now"; if (s < 3600) return `${Math.floor(s/60)}m`; if (s < 86400) return `${Math.floor(s/3600)}h`; return `${Math.floor(s/86400)}d`; };
const clock = t => new Date(t * 1000).toLocaleString([], {weekday: "short", hour: "2-digit", minute: "2-digit"});
const dur = s => { s = Math.round(s); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60; return h ? `${h}:${String(m).padStart(2,"0")}:${String(x).padStart(2,"0")}` : `${m}:${String(x).padStart(2,"0")}`; };
const VERDICT = {pass: "Ready to post", review: "Needs a look", block: "Blocked", pending: "Checking"};
const vpill = v => `<span class="pill ${v}">${VERDICT[v] || v}</span>`;
const RIGHTS = {own: "Your content", permission: "Permission", clip_program: "Clip program", unknown: "No permission"};
const LAYOUT = {auto: "Decide per clip", split: "Facecam on top, gameplay below", face: "Follow the speaker", stack: "Two people, one above the other", speaker: "Two people, cut to whoever talks", wide: "Whole frame on blurred fill", center: "Centre crop", fit: "Already vertical", blur: "Whole frame on blurred fill"};
const PLAT = {instagram: "Instagram", youtube: "YouTube", tiktok: "TikTok", facebook: "Facebook", kick: "Kick", twitch: "Twitch"};

/* ---------------- routing ---------------- */
function route() {
  const v = (location.hash.slice(1).split("/")[0]) || "today";
  S.view = ["today","inbox","streamers","styles","campaigns","queue","accounts","settings"].includes(v) ? v : "today";
  S.sel = location.hash.split("/")[1] || null;
  document.querySelectorAll(".side a[data-v]").forEach(a => a.dataset.v === S.view ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  render();
}
window.addEventListener("hashchange", route);
async function render() {
  clearInterval(S.timer);
  try { await VIEWS[S.view](); } catch (e) { main.innerHTML = `<div class="empty"><b>Couldn't load this screen</b>${esc(e.message)}</div>`; }
  if (S.view === "today") S.timer = setInterval(() => VIEWS.today(true), 3000);
}

/* ---------------- shared state ---------------- */
async function loadState() {
  S.state = await api("/api/state");
  const c = S.state.counts, live = S.state.live;
  const ci = $("#c-inbox"); ci.hidden = !c.to_review; ci.textContent = c.to_review;
  const cf = $("#c-failed"); cf.hidden = !c.failed; cf.textContent = c.failed;
  $("#livedot").className = "dot" + (live.length ? " live" : "");
  $("#livetxt").textContent = live.length ? `${live.length} recording live` : "Nobody live";
  const t = S.state.tools;
  const row = (k, on, txt) => `<span>${k}<i class="${on ? "on" : ""}">${txt}</i></span>`;
  $("#tools").innerHTML = row("Speech to text", t.whisper, t.whisper ? "On" : "Off") +
    row("AI picks", t.ai, t.ai ? esc(t.ai_provider) : "Off") + row("Song ID", t.audd, t.audd ? "On" : "Off") +
    row("Music removal", t.demucs, t.demucs ? "On" : "Off");
  return S.state;
}

/* ---------------- Today ---------------- */
function heatSVG(vals, clips = []) {
  if (!vals || vals.length < 2) return `<svg class="heat" viewBox="0 0 960 64" preserveAspectRatio="none" aria-hidden="true"><rect y="31" width="960" height="1" fill="#2a2a2a"/></svg>`;
  const w = 960 / vals.length;
  const bars = vals.map((v, i) => { const h = Math.max(2, v * 60); const hot = v > .82; return `<rect x="${(i*w).toFixed(1)}" y="${(64-h).toFixed(1)}" width="${Math.max(1,w-2).toFixed(1)}" height="${h.toFixed(1)}" rx="1.5" fill="${hot ? "#c6f24e" : "#3a3a3a"}"/>`; }).join("");
  return `<svg class="heat" viewBox="0 0 960 64" preserveAspectRatio="none" role="img" aria-label="Loudness over the last few minutes; bright bars are the spikes that trigger clips">${bars}</svg>`;
}
function liveBlock(st) {
  if (!st.live.length) return `<div class="empty"><b>Nobody you follow is live right now</b>The radar checks your ${st.streamers || "0"} streamer${st.streamers === 1 ? "" : "s"} every 2 minutes and starts recording on its own. ${st.streamers ? "" : `<a href="#streamers">Add a streamer</a> to start.`}</div>`;
  return st.live.map(l => `<div class="livecard">
    <div><h3><span class="pill live">Live</span>${esc(l.streamer)}</h3><p>${esc(l.title || l.url)} · <span class="num">${dur(l.recorded)}</span> recorded · ${l.clips} clip${l.clips === 1 ? "" : "s"} · ${l.chat ? `${l.chat.toLocaleString()} chat messages` : "chat not connected"}</p></div>
    <div class="liveacts"><button class="btn primary sm" data-clip="${l.job_id}">Clip last 45 s</button><button class="btn ghost sm" data-stop="${l.job_id}">Stop</button></div>
    ${heatSVG(l.heat)}</div>`).join("");
}
const tile = c => `<a class="tile" href="#inbox/${c.id}"><div class="ph" style="background-image:url(/media/thumb/${c.id}.jpg)">${vpill(c.verdict)}<span class="len">${dur(c.duration)}</span></div><b>${esc(c.title || "Untitled clip")}</b><small>${esc(c.streamer || "Your upload")} · ${ago(c.created)}</small></a>`;
async function viewToday(poll = false) {
  const [st, clips] = await Promise.all([loadState(), api("/api/clips?limit=12")]);
  if (poll && S.view !== "today") return;
  const c = st.counts;
  const finding = c.to_review ? `${c.to_review} clip${c.to_review === 1 ? " is" : "s are"} waiting for you` + (c.blocked_today ? ` · the Guard blocked ${c.blocked_today} today` : "")
    : c.scheduled ? `Nothing to review · ${c.scheduled} post${c.scheduled === 1 ? "" : "s"} scheduled` : "Nothing waiting. Paste a link above or add a streamer.";
  const jobs = st.jobs.length ? `<ul class="rows">${st.jobs.map(j => `<li><div class="grow"><span class="t">${esc(j.title || j.url)}</span>
      <small>${j.status === "failed" ? `<span style="color:#ff9aa0">${esc(j.error.slice(0,120))}</span>` : esc(j.step)}</small>
      ${j.status === "working" || j.status === "queued" ? `<div class="bar"><i style="transform:scaleX(${j.progress || 0.02})"></i></div>` : ""}</div>
      ${j.status === "failed" ? `<button class="btn sm" data-retry="${j.id}">Try again</button><button class="btn ghost sm" data-dropjob="${j.id}" aria-label="Remove this job">Remove</button>` : `<span class="pill ${j.status === "done" ? "ok" : ""}">${{done: "Done", working: "Working", queued: "Waiting"}[j.status] || j.status}</span>`}</li>`).join("")}</ul>`
    : `<div class="empty"><b>No videos yet</b>Paste a link in the bar at the top.</div>`;
  const evs = st.events.length ? `<ul class="rows">${st.events.map(e => `<li class="ev ${e.level}"><time>${ago(e.at)}</time><span class="grow">${esc(e.text)}</span></li>`).join("")}</ul>` : `<div class="empty">Nothing has happened yet.</div>`;
  const html = `
  <form class="mclip" id="mclip"><input class="field" type="url" placeholder="Paste a link to clip" aria-label="Link to clip" required><button class="btn primary">Clip</button></form>
  <div class="titlerow"><div><h1>Today</h1><p class="sub">${esc(finding)}</p></div>
    ${c.to_review ? `<a class="btn primary" href="#inbox">Review ${c.to_review} clip${c.to_review === 1 ? "" : "s"}</a>` : ""}</div>
  <div class="grid"><div class="col">

      <div class="kpi"><span>Waiting for you</span><b class="${c.to_review ? "warn" : ""}">${c.to_review}</b><small>in the clip inbox</small></div>
      <div class="kpi"><span>Blocked</span><b class="${c.blocked_today ? "bad" : ""}">${c.blocked_today}</b><small>last 24 hours</small></div>
      <div class="kpi"><span>Posted</span><b>${c.posted_today}</b><small>last 24 hours</small></div>
      <div class="kpi"><span>Scheduled</span><b>${c.scheduled}</b><small>${c.failed ? `<span style="color:#ff9aa0">${c.failed} failed</span>` : "in the post queue"}</small></div>
    </div>

    <section class="card" aria-labelledby="h-clips"><header><h2 id="h-clips">Latest clips</h2><a class="btn ghost sm" href="#inbox">Open inbox</a></header>
      ${clips.length ? `<div class="shelf">${clips.map(tile).join("")}</div>` : `<div class="empty"><b>No clips yet</b>They appear here as soon as a video or stream has been cut and checked.</div>`}</section>
  </div>
  <aside class="col"><div><h2 class="railh">Working on</h2><div class="card" style="padding:8px var(--pad)">${jobs}</div></div>
    <div><h2 class="railh">Activity</h2><div class="card" style="padding:8px var(--pad)">${evs}</div></div></aside></div>`;
  if (poll && document.activeElement && main.contains(document.activeElement)) return; // don't yank focus mid-typing
  main.innerHTML = html;
  main.querySelectorAll("[data-clip]").forEach(b => b.onclick = () => act(b, () => api(`/api/live/${b.dataset.clip}/clip`, {method: "POST", body: {seconds: 45}}), "Cutting the last 45 seconds…"));
  main.querySelectorAll("[data-stop]").forEach(b => b.onclick = () => act(b, () => api(`/api/live/${b.dataset.stop}/stop`, {method: "POST"}), "Recording stopped"));
  const m = $("#mclip"); if (m) m.onsubmit = e => { e.preventDefault(); submitLink(m.querySelector("input").value); };
  main.querySelectorAll("[data-retry]").forEach(b => b.onclick = () => act(b, async () => { await api(`/api/jobs/${b.dataset.retry}/retry`, {method: "POST"}); viewToday(); }, "Trying again"));
  main.querySelectorAll("[data-dropjob]").forEach(b => b.onclick = () => act(b, async () => { await api(`/api/jobs/${b.dataset.dropjob}`, {method: "DELETE"}); viewToday(); }, "Removed"));
}

/* ---------------- Inbox ---------------- */
async function viewInbox() {
  const map = {todo: "state=new", approved: "state=approved", queued: "state=queued", posted: "state=posted", blocked: "verdict=block", rejected: "state=rejected"};
  const [list] = await Promise.all([api(`/api/clips?${map[S.filter]}&limit=120`), loadState()]);
  if (!S.sel && list.length) S.sel = list[0].id;
  const filters = [["todo","To review"],["blocked","Blocked"],["queued","Scheduled"],["posted","Posted"],["rejected","Rejected"]];
  main.innerHTML = `<div class="titlerow"><div><h1>Clip inbox</h1><p class="sub">Every clip after the Guard's check. Nothing from creators without permission is posted until you approve it.</p></div></div>
  <div class="inbox"><div class="qlist" role="listbox" aria-label="Clips">
    <div class="filters">${filters.map(([k,l]) => `<button class="chip" data-f="${k}" aria-pressed="${S.filter === k}">${l}</button>`).join("")}</div>
    ${list.length ? list.map(c => `<button class="qitem" role="option" data-id="${c.id}" aria-selected="${c.id === S.sel}"><img src="/media/thumb/${c.id}.jpg" alt="" loading="lazy" onerror="this.className='noimg'"><div><b>${esc(c.title || "Untitled clip")}</b><small>${esc(c.streamer || "Your upload")} · <span class="num">${dur(c.duration)}</span></small>${vpill(c.verdict)}</div></button>`).join("")
      : `<div class="empty"><b>Nothing here</b>${S.filter === "todo" ? "New clips land here after they're cut and checked." : "No clips in this list."}</div>`}
  </div><div id="detail"></div></div>`;
  main.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { S.filter = b.dataset.f; S.sel = null; history.replaceState(null, "", "#inbox"); viewInbox(); });
  main.querySelectorAll(".qitem").forEach(b => b.onclick = () => { S.sel = b.dataset.id; history.replaceState(null, "", `#inbox/${S.sel}`); main.querySelectorAll(".qitem").forEach(x => x.setAttribute("aria-selected", x === b)); showClip(S.sel); });
  if (S.sel) showClip(S.sel); else $("#detail").innerHTML = "";
}
function musicSVG(curve) {
  if (!curve || !curve.length || Math.max(...curve) < 0.2) return "";
  const w = 600 / curve.length;
  return `<svg class="musicstrip" viewBox="0 0 600 28" preserveAspectRatio="none" role="img" aria-label="Where music was heard in the clip">${curve.map((v,i) => `<rect x="${(i*w).toFixed(1)}" y="${(28 - Math.max(1.5, v*26)).toFixed(1)}" width="${Math.max(1, w-1.5).toFixed(1)}" height="${Math.max(1.5, v*26).toFixed(1)}" rx="1" fill="${v > .55 ? "#e5a93b" : "#3a3a3a"}"/>`).join("")}</svg>`;
}

      ${c.can_relayout && c.window ? `<div class="trim"><h3>Edit this clip</h3>

        <div class="trimrow"><label for="t-s">Start</label><input type="range" id="t-s" min="0" max="${(c.window.to - c.window.from).toFixed(1)}" step="0.1" value="${(c.window.start - c.window.from).toFixed(1)}"><output id="o-s"></output><button type="button" class="btn ghost sm" data-mark="s">Set to player</button></div>
        <div class="trimrow"><label for="t-e">End</label><input type="range" id="t-e" min="0" max="${(c.window.to - c.window.from).toFixed(1)}" step="0.1" value="${(c.window.end - c.window.from).toFixed(1)}"><output id="o-e"></output><button type="button" class="btn ghost sm" data-mark="e">Set to player</button></div>

        ${g.layout !== "fit" ? `<label class="f" for="lay" style="margin-top:12px">Layout</label><select class="field" id="lay">${["auto","split","face","speaker","stack","wide","center"].map(k => `<option value="${k}" ${(g.layout_choice || "auto") === k ? "selected" : ""}>${LAYOUT[k]}</option>`).join("")}</select>` : ""}
        ${SD ? `<label class="f" for="cstyle" style="margin-top:12px">Style</label><select class="field" id="cstyle">${SD.styles.map(s => `<option value="${s.id}" ${(g.style_id || SD.default) === s.id ? "selected" : ""}>${esc(s.name)}${s.template ? " (template)" : ""}</option>`).join("")}</select>` : ""}
        <div class="acts" style="margin-top:12px"><button class="btn sm" type="button" id="t-play">Play the selection</button><button class="btn primary sm" type="button" id="relay">Render again</button></div>
        <p class="hint">Takes about a minute. Dead air, cold open, zooms and sounds are redone for the new cut, in the style you picked.</p></div>` : ""}
      <div class="acts" style="margin:12px 4px 4px"><a class="btn ghost sm" href="/media/clip/${c.id}.mp4" download>Download</a></div></div>
    <div class="col">
      <section class="card" aria-labelledby="h-guard"><div class="verdict ${c.verdict}"><strong id="h-guard">${VERDICT[c.verdict] || c.verdict}</strong><span class="muted">${esc(c.title)}</span></div>
        <p class="muted" style="margin:0 0 14px">${c.verdict === "pass" ? "Every check passed." : c.verdict === "review" ? "The Guard isn't sure about something below. Watch it, then approve or reject." : "Something here would get the post taken down or the account struck."}${c.why ? " Picked because: " + esc(c.why) : ""}</p>
        <ul class="checks">${checks.map(k => `<li class="${k.status}"><span class="mk" aria-hidden="true"></span><b>${esc(k.label)}<span class="sr" style="position:absolute;left:-9999px">: ${status[k.status]}</span></b><p>${esc(k.detail)}${k.fix ? `<em>${esc(k.fix)}</em>` : ""}${k.id === "music" ? musicSVG(g.music_curve) : ""}</p></li>`).join("")}</ul>
      </section>
      <section class="card" aria-labelledby="h-cap"><header><h2 id="h-cap">Title and captions</h2></header>
        <label class="f" for="ctitle">Title</label><input class="field" id="ctitle" value="${esc(c.title)}" style="margin-bottom:14px">
        <div class="tabs" role="tablist">${plats.map((p,i) => `<button role="tab" data-p="${p}" aria-selected="${i===0}">${PLAT[p]}</button>`).join("")}</div>
        ${plats.map((p,i) => { const v = caps[p]; const text = typeof v === "object" ? `${v.title}\n\n${v.description}` : v; return `<textarea class="field" data-cap="${p}" aria-label="${PLAT[p]} caption" ${i ? "hidden" : ""} rows="6">${esc(text)}</textarea>`; }).join("")}
        <div class="acts" style="margin-top:12px"><button class="btn sm" id="savecap">Save text</button></div>
      </section>
      ${c.can_relayout ? `<section class="card" aria-labelledby="h-look"><header><h2 id="h-look">Captions and heading</h2><span class="faint" id="lk-state"></span></header>

          <div class="tctl"><p class="muted" style="margin:0 0 12px">Drag the captions or the heading to put them anywhere. Drag the round handle on the corner to make them bigger or smaller.</p>
            <dl class="lkvals" id="lkvals"></dl>
            <label class="f" for="lk-at" style="margin-top:10px">Frame to line it up on</label><input type="range" id="lk-at" min="0" max="1" step="0.1" value="0.5" style="width:100%;accent-color:var(--accent,#e5a93b)">
            <div class="acts" style="margin-top:12px"><button class="btn primary sm" type="button" id="lk-go" disabled>Render with these changes</button><button class="btn ghost sm" type="button" id="lk-reset">Back to the style's</button></div>
            <p class="hint">About a minute. The cut, zooms and sounds stay as they are. Positions you set stay put, even over a face.</p></div></div></section>` : ""}

          <div class="tctl">
            <label class="f" for="t-at">Frame</label><div class="trimrow" style="grid-template-columns:1fr 54px"><input type="range" id="t-at" min="0" max="${Math.max(1, c.duration).toFixed(1)}" step="0.1" value="${(+(th.at ?? 1)).toFixed(1)}" ${th.custom ? "disabled" : ""}><output id="o-at">${dur(+(th.at ?? 1))}</output></div>
            <label class="f" for="t-text" style="margin-top:10px">Text</label><input class="field" id="t-text" maxlength="120" value="${esc(th.text ?? (c.hook || ""))}" placeholder="What happens in the clip">
            <div class="swrow" style="margin-top:6px"><div><b>Show the text</b></div><span class="tog"><input type="checkbox" id="t-show" aria-label="Show the text" ${(th.settings?.text ?? true) ? "checked" : ""}><span></span></span></div>
            <div class="swrow"><div><b>Cover on Instagram and TikTok</b><p>Goes in as the video's first 1/15 second.</p></div><span class="tog"><input type="checkbox" id="t-first" aria-label="Use as the cover on Instagram and TikTok" ${(th.first_frame ?? true) ? "checked" : ""}><span></span></span></div>
            <div class="acts" style="margin-top:10px"><button class="btn primary sm" type="button" id="t-save">Save thumbnail</button>
              <label class="btn sm" for="t-file" style="cursor:pointer">Use my own picture</label><input type="file" id="t-file" accept="image/jpeg,image/png,image/webp" hidden>
              ${th.custom || th.edited ? `<button class="btn ghost sm" type="button" id="t-reset">Back to the style's</button>` : ""}
              <a class="btn ghost sm" href="/media/cover/${c.id}.jpg" download="thumbnail-${c.id}.jpg">Download</a></div>
          </div></div></section>
      <section class="card" aria-labelledby="h-post"><header><h2 id="h-post">Post it</h2>${c.posts.length ? `<span class="faint">${c.posts.map(p => `${esc(p.status)} ${p.remote_url ? `<a href="${esc(p.remote_url)}" target="_blank" rel="noopener">open</a>` : ""}`).join(" · ")}</span>` : ""}</header>
        ${accs.accounts.length ? `<div class="targets">${accs.accounts.map(a => `<label><input type="checkbox" value="${a.id}" checked> ${PLAT[a.platform]} · ${esc(a.name)}</label>`).join("")}</div>`
          : `<p class="muted" style="margin:0 0 14px">No accounts connected yet. <a href="#accounts">Connect Instagram, YouTube or TikTok</a>.</p>`}

          <button class="btn ghost" id="recheck">Check again</button>
          <button class="btn danger" id="reject" ${c.state === "rejected" ? "disabled" : ""}>Reject</button>
        </div></section>

  box.querySelectorAll("[role=tab]").forEach(t => t.onclick = () => { box.querySelectorAll("[role=tab]").forEach(x => x.setAttribute("aria-selected", x === t)); box.querySelectorAll("[data-cap]").forEach(a => a.hidden = a.dataset.cap !== t.dataset.p); });

    ts.oninput = () => { draw(); sv.currentTime = +ts.value; }; te.oninput = () => { draw(); sv.currentTime = +te.value; };
    sv.onloadedmetadata = () => { if (sv.duration && isFinite(sv.duration)) { ts.max = te.max = sv.duration.toFixed(1); } sv.currentTime = +ts.value; draw(); };
    box.querySelectorAll("[data-mark]").forEach(bt => bt.onclick = () => { (bt.dataset.mark === "s" ? ts : te).value = sv.currentTime.toFixed(1); draw(); });
    let stopAt = null; sv.ontimeupdate = () => { if (stopAt !== null && sv.currentTime >= stopAt) { sv.pause(); stopAt = null; } };
    $("#t-play").onclick = () => { sv.currentTime = +ts.value; stopAt = +te.value; sv.play(); };
    draw();
    $("#relay").onclick = e => act(e.currentTarget, async () => {
      await api(`/api/clips/${id}/edit`, {method: "POST", body: {start: w.from + +ts.value, end: w.from + +te.value, hook: $("#t-hook").value, layout: $("#lay")?.value, title: $("#ctitle").value, style_id: $("#cstyle")?.value}});
      S.bust = Date.now(); showClip(id); }, "Rendered");
  }
  {   // thumbnail: scrub the clean clip to pick a frame, then render it with the text
    const at = $("#t-at"), tv = $("#tvid"), img = $("#tcover");
    tv.onloadedmetadata = () => { if (isFinite(tv.duration) && tv.duration) at.max = Math.max(0.5, tv.duration - 0.3).toFixed(1); };
    at.oninput = () => { $("#o-at").textContent = dur(+at.value); tv.hidden = false; img.hidden = true; tv.currentTime = +at.value; };
    $("#t-save").onclick = e => act(e.currentTarget, async () => {
      await api(`/api/clips/${id}/thumbnail`, {method: "POST", body: {at: at.disabled ? null : +at.value, text: $("#t-text").value, show_text: $("#t-show").checked, first_frame: $("#t-first").checked}});
      S.bust = Date.now(); showClip(id); }, "Thumbnail saved");
    $("#t-file").onchange = async () => { const f = $("#t-file").files[0]; if (!f) return;

        if (!r.ok) throw new Error(j.detail || "Couldn't use that picture"); S.bust = Date.now(); toast("Thumbnail saved"); showClip(id); }
      catch (err) { toast(err.message, true); } };
    if ($("#t-reset")) $("#t-reset").onclick = e => act(e.currentTarget, async () => { await api(`/api/clips/${id}/thumbnail`, {method: "POST", body: {reset: true}}); S.bust = Date.now(); showClip(id); }, "Back to the style's thumbnail");
  }
  $("#recheck").onclick = e => act(e.currentTarget, async () => { await api(`/api/clips/${id}/recheck`, {method: "POST"}); showClip(id); }, "Checked again");
  $("#reject").onclick = e => act(e.currentTarget, async () => { await api(`/api/clips/${id}/reject`, {method: "POST"}); viewInbox(); }, "Rejected");
}

/* ---------------- Inbox: move and resize one clip's captions and heading ---------------- */
async function clipLook(c, box) {
  let L;
  try { await styleData(); L = await api(`/api/clips/${c.id}/look${$("#cstyle") ? `?style_id=${encodeURIComponent($("#cstyle").value)}` : ""}`); }
  catch (e) { $("#lkphone").innerHTML = `<p class="muted">${esc(e.message)}</p>`; return; }
  const over = JSON.parse(JSON.stringify(L.over || {})), smp = {...L.sample};
  const saved = JSON.stringify(over);
  const merged = () => { const st = JSON.parse(JSON.stringify(L.style));
    for (const g of ["captions", "heading"]) Object.assign(st[g], over[g] || {}); return st; };
  const at = $("#lk-at"), s0 = +(smp.start ?? smp.at), s1 = +(smp.end ?? smp.at);
  at.min = s0.toFixed(1); at.max = Math.max(s0 + 0.1, s1).toFixed(1); at.value = (+smp.at).toFixed(1);
  const vals = () => { const st = merged(), f = (g, n) => st[g].show
      ? `<dt>${n}</dt><dd>${st[g].size}% · ${over[g]?.y != null ? `placed by you` : "placed by the style"}</dd>` : `<dt>${n}</dt><dd>off in this style</dd>`;
    $("#lkvals").innerHTML = f("captions", "Captions") + f("heading", "Heading");
    const dirty = JSON.stringify(over) !== saved;
    $("#lk-go").disabled = !dirty || !L.can_render;
    $("#lk-state").textContent = !L.can_render ? "Original video is gone, so it can't render again" : dirty ? "Not rendered yet" : Object.keys(over).length ? "Your own placement" : "As the style places them"; };
  const draw = () => {
    const st = merged(); $("#lkphone").innerHTML = phoneHTML(st, smp, true, "clip");
    wirePhone($("#lkphone .phone"), st, smp, kind => {
      if (kind === "captions" || kind === "heading") over[kind] = {...(over[kind] || {}), x: st[kind].x, y: st[kind].y, size: st[kind].size};
      draw();
    });
    vals();
  };
  at.oninput = () => { smp.at = +at.value; draw(); };
  $("#lk-reset").onclick = () => { for (const k of Object.keys(over)) delete over[k]; draw(); };
  $("#lk-go").onclick = e => act(e.currentTarget, async () => {
    await api(`/api/clips/${c.id}/edit`, {method: "POST", body: {over}}); S.bust = Date.now(); showClip(c.id); }, "Rendered with your changes");

  draw();
}

/* ---------------- Styles: how clips look ---------------- */
let SD = null, SAMPLE, ED = null;
const fontsIn = new Set();
async function styleData(force = false) {
  if (!SD || force) {
    SD = await api("/api/styles");
    let css = "";
    for (const [n, f] of Object.entries(SD.fonts)) if (!fontsIn.has(n)) { fontsIn.add(n); css += `@font-face{font-family:"BC ${n}";src:url(/fonts/${f.file}) format("truetype");font-display:block}`; }
    if (css) { const el = document.createElement("style"); el.textContent = css; document.head.append(el); }
  }
  return SD;
}
async function sampleClip() {

    p.innerHTML = `<div class="sgroup">${tog("heading.show", "Show the heading", hs.show, "The clip's hook, on top. The AI writes it; you can change it on each clip.")}</div>
      <div class="sgroup"><h3>Look</h3><div class="tiles">${Object.entries(O.heads).map(([k, l]) => look(k, l)).join("")}</div></div>
      <div class="sgroup"><h3>Font</h3>${chipset("heading.font", fonts, hs.font, "font")}</div>
      <div class="sgroup"><h3>Size and timing</h3>${slider("heading.size", "Size", 40, 160, hs.size, "%")}${tog("heading.upper", "Capital letters", hs.upper)}${tog("heading.whole", "Keep it on screen the whole clip", hs.whole, "Off: it shows for the first two or three seconds.")}
        <div class="swrow"><div><b>Position</b><p>${hs.y == null ? "Decided per clip, and always off faces." : `Moved by you (${Math.round(hs.y * 100)}% down).`}</p></div>${hs.y == null ? "" : `<button class="btn ghost sm" data-reset="heading">Automatic</button>`}</div></div>`;
  } else if (ED.tab === "thumb") {

    p.innerHTML = `<div class="sgroup">${tog("thumb.text", "Text on the thumbnail", th.text, "Big text over the frame, so the cover says what happens.")}
        <div style="margin-top:10px">${chipset("thumb.source", O.thumb_text, th.source)}</div><p class="hint">You can change the text on any clip in the Clip inbox.</p></div>
      <div class="sgroup"><h3>Look</h3><div class="tiles">${Object.entries(O.heads).map(([k, l]) => look(k, l)).join("")}</div></div>
      <div class="sgroup"><h3>Font</h3>${chipset("thumb.font", fonts, th.font, "font")}</div>
      <div class="sgroup"><h3>Size and spot</h3>${slider("thumb.size", "Size", 50, 160, th.size, "%")}${tog("thumb.upper", "Capital letters", th.upper)}
        <div style="margin-top:10px">${chipset("thumb.spot", O.thumb_spots, th.spot)}</div></div>
      <div class="sgroup"><h3>Picture</h3>${chipset("thumb.frame", O.thumb_frames, th.frame)}
        <p class="hint">The biggest reaction is the frame on the loudest moment, a face mid-reaction. Pick any other frame per clip.</p>
        ${tog("thumb.punch", "Punch up the picture", th.punch, "A little more contrast and colour, like editors do for covers.")}</div>
      <div class="sgroup"><h3>Where it shows</h3>${tog("thumb.first_frame", "Use it as the cover on Instagram and TikTok", th.first_frame, "They only take the cover as a frame of the video, so the thumbnail goes in as its first 1/15 second. YouTube gets it as the thumbnail itself (on channels verified by phone).")}</div>`;
  } else {
    const fr = (k, l, pic) => `<button type="button" class="tilebtn" data-pick="layout.framing" data-v="${k}" aria-pressed="${L.framing === k}"><div class="sw" style="background:#0a0a0a">${pic}</div>${esc(l)}</button>`;
    const mini = inner => `<div style="width:30px;height:52px;border-radius:5px;background:#1d1d1d;position:relative;overflow:hidden">${inner}</div>`;
    const noCams = SAMPLE?.clip_id && !(SAMPLE.cams || []).length && L.cam_find !== "draw";
    p.innerHTML = `<div class="sgroup"><h3>Video</h3><div class="tiles">
        ${fr("smart", "Smart", mini(`<i style="position:absolute;inset:0;background:linear-gradient(160deg,#5c7a3a,#2a3a1e)"></i><i style="position:absolute;left:9px;top:12px;width:12px;height:12px;border-radius:50%;background:#e8c9a6"></i>`))}
        ${fr("blur", "Full + blur", mini(`<i style="position:absolute;inset:0;background:#2d3a22;filter:blur(2px)"></i><i style="position:absolute;left:0;right:0;top:18px;height:16px;background:linear-gradient(90deg,#5c7a3a,#8aa65a)"></i>`))}
        ${fr("zoom", "Zoomed in", mini(`<i style="position:absolute;inset:0;background:#2d3a22"></i><i style="position:absolute;left:0;right:0;top:11px;height:30px;background:linear-gradient(90deg,#5c7a3a,#8aa65a)"></i>`))}
        ${fr("fill", "Fill the screen", mini(`<i style="position:absolute;inset:0;background:linear-gradient(90deg,#5c7a3a,#8aa65a)"></i>`))}</div>
        <p class="hint">Smart follows faces and picks the layout per clip. A streamer's own layout setting still wins.</p></div>
      <div class="sgroup"><h3>Streamer cam</h3>${chipset("layout.cam", O.cams, L.cam)}
        ${L.cam === "corner" ? `<div style="margin-top:12px">${slider("layout.corner.w", "Cam size", 20, 70, Math.round(L.corner.w * 100), "%")}${slider("layout.round", "Rounded corners", 0, 80, L.round)}${slider("layout.border", "Border", 0, 16, L.border)}<div class="colors" style="margin-top:8px"><label><input type="color" data-col="layout.border_color" value="${L.border_color.toLowerCase()}">Border colour</label></div><p class="hint">Drag the cam box in the preview to place it.</p></div>` : ""}
        ${noCams && L.cam !== "off" ? `<p class="hint">Your newest clip has no cam the AI could find. Draw it below to see it here.</p>` : ""}</div>
      ${L.cam !== "off" ? `<div class="sgroup"><h3>Where's the cam in the stream?</h3>${chipset("layout.cam_find", {ai: "AI picks it", draw: "Draw it"}, L.cam_find)}
        <p class="hint">${L.cam_find === "ai" ? "The AI finds each streamer's own cam on their stream." : "Drag a box around the cam. Every clip uses this spot, so it fits streamers who keep their cam in one place."}</p>
        <div class="drawbox" id="dcam"></div></div>` : ""}
      <div class="sgroup"><h3>Part of the video</h3>${chipset("layout.partmode", {all: "All of it", pick: "Pick a part"}, L.part ? "pick" : "all")}
        <p class="hint">Zoomed-in stream, or only one part matters? Draw the part to show. The box is what the clip shows.</p>${L.part ? `<div class="drawbox" id="dpart"></div>` : ""}</div>`;
    if ($("#dcam")) drawRect($("#dcam"), L.cam_find === "draw" ? L.cam_box : null, r => { L.cam_box = r; L.cam_find = "draw"; changed(); }, L.cam_find === "draw" ? "Cam" : null,
      L.cam_find === "ai" ? (SAMPLE?.cams || []) : [], L.cam_find === "draw");
    if ($("#dpart")) drawRect($("#dpart"), L.part, r => { L.part = r; changed(); }, "Video", [], true);
  }
  p.querySelectorAll("[data-tog]").forEach(i => i.onchange = () => { setK(i.dataset.tog, i.checked); changed(); });
  p.querySelectorAll("[data-sl]").forEach(i => i.oninput = () => { const k = i.dataset.sl; setK(k, k === "layout.corner.w" ? +i.value / 100 : +i.value); i.nextElementSibling.textContent = i.value + (i.nextElementSibling.textContent.endsWith("%") ? "%" : ""); changed(); });
  p.querySelectorAll("[data-col]").forEach(i => i.oninput = () => { setK(i.dataset.col, i.value.toUpperCase()); changed(); });
  p.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => {
    const k = b.dataset.pick, v = b.dataset.v;
    if (k === "layout.partmode") { L.part = v === "pick" ? (L.part || [0.15, 0.08, 0.7, 0.84]) : null; }
    else if (k === "layout.cam_find" && v === "draw" && !L.cam_box) { L.cam_box = (SAMPLE?.cams || [])[0] || [0.02, 0.62, 0.25, 0.33]; L.cam_find = "draw"; }
    else setK(k, v);
    changed(true);
  });
  p.querySelectorAll("[data-preset]").forEach(b => b.onclick = () => { const v = O.presets[b.dataset.preset]; Object.assign(cs, Object.fromEntries(Object.entries(v).filter(([k]) => k !== "label")), {preset: b.dataset.preset}); changed(true); });
  p.querySelectorAll("[data-reset]").forEach(b => b.onclick = () => { st[b.dataset.reset].y = null; changed(true); });
}
/* a box drawn on a still of the original video: drag inside to move, the corner to resize, outside to draw anew */
function drawRect(box, rect, onChange, label, aiRects = [], editable = true) {
  const W = SAMPLE?.w || 1920, H = SAMPLE?.h || 1080;
  box.style.aspectRatio = `${W}/${H}`;
  box.innerHTML = (SAMPLE?.clip_id ? `<img src="/media/style-frame.jpg?at=${SAMPLE.at}&c=${SAMPLE.clip_id}" alt="A frame of your newest clip's video" draggable="false">` : `<div class="ph-ph" style="position:absolute;inset:0;display:grid;place-items:center;color:#555;font-size:12px">Make a clip to see your video here</div>`)
    + aiRects.map(r => `<div class="rect ai" style="left:${r[0] * 100}%;top:${r[1] * 100}%;width:${r[2] * 100}%;height:${r[3] * 100}%"><span>Found by AI</span></div>`).join("")
    + (rect ? `<div class="rect" id="r-${box.id}" style="left:${rect[0] * 100}%;top:${rect[1] * 100}%;width:${rect[2] * 100}%;height:${rect[3] * 100}%"><span>${esc(label || "")}</span></div>` : "");
  if (!editable) { box.style.cursor = "default"; return; }
  let cur = rect ? [...rect] : null;
  const el = () => box.querySelector(".rect:not(.ai)");
  const paint = () => { let e = el(); if (!e) { box.insertAdjacentHTML("beforeend", `<div class="rect"><span>${esc(label || "")}</span></div>`); e = el(); }
    Object.assign(e.style, {left: cur[0] * 100 + "%", top: cur[1] * 100 + "%", width: cur[2] * 100 + "%", height: cur[3] * 100 + "%"}); };
  box.onpointerdown = e => {
    if (e.button !== 0) return; e.preventDefault(); box.setPointerCapture(e.pointerId);
    const r = box.getBoundingClientRect(), px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
    const clamp = v => Math.min(1, Math.max(0, v));
    let mode = "new", s0 = cur ? [...cur] : null;
    if (cur) { const [x, y, w, h] = cur, nearCorner = Math.abs(px - (x + w)) * r.width < 14 && Math.abs(py - (y + h)) * r.height < 14;
      if (nearCorner) mode = "size"; else if (px >= x && px <= x + w && py >= y && py <= y + h) mode = "move"; }
    box.onpointermove = m => {
      const mx = clamp((m.clientX - r.left) / r.width), my = clamp((m.clientY - r.top) / r.height);
      if (mode === "new") cur = [Math.min(px, mx), Math.min(py, my), Math.abs(mx - px), Math.abs(my - py)];
      else if (mode === "move") cur = [Math.min(1 - s0[2], Math.max(0, s0[0] + mx - px)), Math.min(1 - s0[3], Math.max(0, s0[1] + my - py)), s0[2], s0[3]];
      else cur = [s0[0], s0[1], Math.max(0.04, mx - s0[0]), Math.max(0.04, my - s0[1])];
      paint();
    };
    box.onpointerup = () => { box.onpointermove = null; if (cur && cur[2] > 0.03 && cur[3] > 0.03) onChange(cur.map(v => Math.round(v * 10000) / 10000)); };
  };
}

/* ---------------- clip options (next to Make clips) ---------------- */
const OPT_KEY = "bcut.clipopts", OPT_USUAL = {streamer_id: "", style_id: "", captions: "auto", count: 6, min_len: 15, max_len: 60, from: "", to: ""};
function readOpts() { try { return {...OPT_USUAL, ...JSON.parse(localStorage.getItem(OPT_KEY) || "{}")}; } catch (e) { return {...OPT_USUAL}; } }
function saveOpts(o) { try { localStorage.setItem(OPT_KEY, JSON.stringify(o)); } catch (e) {} }
function optsFromForm() {
  const n = id => $(id).value.trim();
  return {streamer_id: n("#o-streamer"), style_id: n("#o-style"), captions: n("#o-lang") || "auto", count: +n("#o-count") || 6,
    min_len: +n("#o-min") || 15, max_len: +n("#o-max") || 60, from: n("#o-from"), to: n("#o-to")};
}
function clipOptions() {            // what goes with a link or an upload
  const o = readOpts(), m = v => v === "" || isNaN(+v) ? null : Math.round(+v * 60);
  return {streamer_id: o.streamer_id || null, style_id: o.style_id, captions: o.captions, count: o.count, min_len: o.min_len, max_len: o.max_len, from: m(o.from), to: m(o.to)};
}
async function refreshPickers() {
  try {
    const [sd, ss] = await Promise.all([styleData(), api("/api/streamers")]);
    const o = readOpts();
    $("#o-style").innerHTML = `<option value="">Your default · ${esc(sd.styles.find(s => s.default)?.name || "Default")}</option>` + sd.styles.map(s => `<option value="${s.id}">${esc(s.name)}${s.template ? " (template)" : ""}</option>`).join("");
    $("#o-lang").innerHTML = Object.entries(sd.languages).map(([k, l]) => `<option value="${k}">${esc(l)}</option>`).join("");
    $("#o-streamer").innerHTML = `<option value="">No streamer</option>` + ss.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join("");
    for (const [k, id] of [["streamer_id", "#o-streamer"], ["style_id", "#o-style"], ["captions", "#o-lang"], ["count", "#o-count"], ["min_len", "#o-min"], ["max_len", "#o-max"], ["from", "#o-from"], ["to", "#o-to"]]) $(id).value = o[k] ?? "";
    if ($("#o-style").value !== (o.style_id || "")) $("#o-style").value = "";
    markOpts();
  } catch (e) {}
}
function markOpts() { const o = readOpts(), on = Object.keys(OPT_USUAL).some(k => String(o[k] ?? "") !== String(OPT_USUAL[k]));
  $("#optbtn").style.boxShadow = on ? "inset 0 0 0 2px var(--accent)" : ""; $("#optbtn").title = on ? "Clip options (changed from the usual)" : "Clip options: how many, how long, which part, captions, style"; }
function openOpts(open) {
  const p = $("#clipopts"), b = $("#optbtn"), r = b.getBoundingClientRect();
  if (open) { p.style.left = Math.max(12, Math.min(r.right - p.offsetWidth, window.innerWidth - p.offsetWidth - 12)) + "px"; p.style.top = (r.bottom + 10) + "px"; p.style.transformOrigin = "top right"; p.removeAttribute("data-hide"); refreshPickers(); }
  else p.setAttribute("data-hide", "");
  b.setAttribute("aria-expanded", open);
}
$("#optbtn").onclick = () => openOpts($("#clipopts").hasAttribute("data-hide"));
$("#o-done").onclick = () => openOpts(false);
$("#o-reset").onclick = () => { saveOpts({}); refreshPickers(); toast("Back to the usual options"); };
$("#clipopts").addEventListener("change", () => { saveOpts(optsFromForm()); markOpts(); });
$("#clipopts").addEventListener("input", e => { if (e.target.matches("#o-count,#o-min,#o-max,#o-from,#o-to")) { saveOpts(optsFromForm()); markOpts(); } });
$("#clipopts").querySelectorAll("[data-step]").forEach(b => b.onclick = () => { const [id, d] = b.dataset.step.split(":"), i = $("#" + id);
  const lim = {"o-count": [1, 30], "o-min": [5, 170], "o-max": [8, 180]}[id]; i.value = Math.min(lim[1], Math.max(lim[0], (+i.value || 0) + +d)); saveOpts(optsFromForm()); markOpts(); });
document.addEventListener("pointerdown", e => { if (!$("#clipopts").hasAttribute("data-hide") && !e.target.closest("#clipopts,#optbtn")) openOpts(false); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#clipopts").hasAttribute("data-hide")) { openOpts(false); $("#optbtn").focus(); } });

const VIEWS = {today: viewToday, inbox: viewInbox, streamers: viewStreamers, styles: viewStyles, campaigns: viewCampaigns, queue: viewQueue, accounts: viewAccounts, settings: viewSettings};

/* ---------------- top bar: clip a link / upload ---------------- */
async function submitLink(url) {
  try { await api("/api/jobs", {method: "POST", body: {url, rights: $("#cliprights")?.value || "unknown", campaign_id: $("#clipcamp").value, ...clipOptions()}}); toast("Added. It shows under Working on."); $("#clipurl").value = ""; openOpts(false); if (S.view === "today") viewToday(); else location.hash = "#today"; }
  catch (e) { toast(e.message, true); }
}
$("#clipform").onsubmit = e => { e.preventDefault(); submitLink($("#clipurl").value.trim()); };
$("#clipform label[for=upfile]").onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("#upfile").click(); } };
$("#upfile").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  const fd = new FormData(); fd.append("file", f); fd.append("options", JSON.stringify(clipOptions())); toast(`Uploading ${f.name}…`);
  try { await api("/api/upload", {method: "POST", body: fd}); toast("Uploaded. Clipping it now."); location.hash = "#today"; viewToday(); } catch (err) { toast(err.message, true); }
  e.target.value = "";
};
async function loadCampaignPicker() {
  try { const cs = (await api("/api/campaigns")).filter(c => c.status === "active");
    const sel = $("#clipcamp"), cur = sel.value;
    sel.innerHTML = `<option value="">No campaign</option>` + cs.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join("");
    sel.value = cs.some(c => c.id === cur) ? cur : ""; sel.hidden = !cs.length; } catch (e) {}
}
loadCampaignPicker();
refreshPickers();
route();
